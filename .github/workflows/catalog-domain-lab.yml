name: S010B catalog domain lab
on:
  pull_request:
    branches: [work/s0-07-new-origin-backend-foundation, work/s0-10b-catalog-domain-lab]
  push:
    branches: [work/s0-10b-catalog-domain-lab, work/s0-10c-private-assistant-domain]
permissions:
  contents: read
concurrency:
  group: catalog-domain-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Official postgres:17.11-bookworm manifest digest verified from registry.
        image: postgres@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_DB: cac_s007_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-s007-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cac_s007_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: cac_s007_test
      PGPASSWORD: synthetic-s007-disposable-only
      CAC_EXPERIMENTAL_DISPOSABLE: '1'
      CAC_DB_ROLE: cac_owner
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: experimental/backend
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source and prepare paths
        id: provenance
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          cd "$GITHUB_WORKSPACE"
          tested=$(git rev-parse HEAD)
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_NAME:$PR_HEAD_REF:$PR_BASE_REF" in
            push:work/s0-10b-catalog-domain-lab::)
              mode=catalog
              head=$GITHUB_SHA
              ;;
            push:work/s0-10c-private-assistant-domain::)
              mode=stacked-assistant
              head=$GITHUB_SHA
              ;;
            pull_request:*:work/s0-10b-catalog-domain-lab:work/s0-07-new-origin-backend-foundation)
              mode=catalog
              head=$PR_HEAD
              ;;
            pull_request:*:work/s0-10c-private-assistant-domain:work/s0-10b-catalog-domain-lab)
              mode=stacked-assistant
              head=$PR_HEAD
              ;;
            *) echo "::error::Unsupported catalog workflow branch and target"; exit 1 ;;
          esac
          if [[ "$mode" == catalog ]]; then
            base=a27eab0e978c6c60d54fab45b9f467ebd7ddff56
            accepted=$base
          else
            base=96cf1f1a094362187516b6d61edcd3a9687e6e5c
            accepted=0a240bd33693b265dad2193cefe1c7d9cd926e53
          fi
          test "$tested" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY"
            test "$PR_BASE" = "$base"
            test "$(git rev-list --parents -n 1 "$tested")" = "$tested $base $head"
            test "$(git rev-parse "$head^{tree}")" = "$(git rev-parse "$tested^{tree}")"
          else
            test "$tested" = "$head"
          fi
          if [[ "$mode" == catalog ]]; then
            git merge-base --is-ancestor "$base" "$head"
            git diff --quiet "$base" "$head" -- . \
              ':(exclude).github/workflows/catalog-domain-lab.yml' \
              ':(exclude)docs/changes/CR-S0-10B-001-catalog.md' \
              ':(exclude)experimental/backend/catalog_lab/**' \
              ':(exclude)experimental/backend/catalog_tests/**' \
              ':(exclude)experimental/backend/config/catalog_settings.py' \
              ':(exclude)experimental/backend/scripts/catalog_*.py'
          else
            test "$(git rev-list --parents -n 1 "$accepted")" = "$accepted $base"
            test "$(git rev-list --parents -n 1 "$head")" = "$head $accepted"
            # Check both the reviewed C additions and the narrower R1 delta.
            git diff --quiet "$base" "$accepted" -- . \
              ':(exclude)experimental/backend/private_assistant/__init__.py' \
              ':(exclude)experimental/backend/private_assistant/migrations/__init__.py' \
              ':(exclude)experimental/backend/assistant_tests/__init__.py' \
              ':(exclude)experimental/backend/config/assistant_settings.py' \
              ':(exclude)experimental/backend/private_assistant/models.py' \
              ':(exclude)experimental/backend/private_assistant/migrations/0001_assistant.py' \
              ':(exclude)experimental/backend/private_assistant/migrations/assistant.sql' \
              ':(exclude)experimental/backend/private_assistant/service.py' \
              ':(exclude)experimental/backend/assistant_tests/test_assistant.py' \
              ':(exclude)experimental/backend/scripts/assistant_roundtrip.py' \
              ':(exclude).github/workflows/private-assistant-domain-lab.yml' \
              ':(exclude)docs/changes/CR-S0-10C-001-private-assistant.md'
            git diff --quiet "$accepted" "$head" -- . \
              ':(exclude).github/workflows/catalog-domain-lab.yml' \
              ':(exclude).github/workflows/private-assistant-domain-lab.yml'
          fi
          mkdir -p "$GITHUB_WORKSPACE/evidence-catalog"
          printf 'mode=%s\nbase=%s\naccepted=%s\nhead=%s\ntested=%s\n' \
            "$mode" "$base" "$accepted" "$head" "$tested" > "$GITHUB_WORKSPACE/evidence-catalog/revision.txt"
          echo "CAC_TEST_CONFIG=$RUNNER_TEMP/cac-s010b-foundation.json" >> "$GITHUB_ENV"
          echo "CAC_CATALOG_CONFIG=$RUNNER_TEMP/cac-s010b-catalog.json" >> "$GITHUB_ENV"
          echo "CATALOG_EVIDENCE=$GITHUB_WORKSPACE/evidence-catalog" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.15'
      - name: Bootstrap pinned Django and PostgreSQL
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          python -VV > "$CATALOG_EVIDENCE/environment.txt"
          python -m django --version >> "$CATALOG_EVIDENCE/environment.txt"
          python scripts/bootstrap.py | tee "$CATALOG_EVIDENCE/setup.log"
          python -c "import psycopg; c=psycopg.connect(user='postgres'); print(c.execute('SELECT version()').fetchone()[0]); c.close()" >> "$CATALOG_EVIDENCE/environment.txt"
          python manage.py migrate --noinput | tee -a "$CATALOG_EVIDENCE/setup.log"
      - name: Inherited S0-07B 43-test regression
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$CATALOG_EVIDENCE/regression.log"
          grep -Eq 'Ran 43 tests? ' "$CATALOG_EVIDENCE/regression.log"
      - name: Add and verify catalog migration
        env:
          DJANGO_SETTINGS_MODULE: config.catalog_settings
        run: |
          python scripts/catalog_bootstrap.py role | tee -a "$CATALOG_EVIDENCE/setup.log"
          {
            python manage.py migrate --noinput
            python manage.py check
            python manage.py makemigrations --check --dry-run
          } | tee "$CATALOG_EVIDENCE/schema.log"
          python scripts/catalog_roundtrip.py | tee "$CATALOG_EVIDENCE/roundtrip.log"
          python scripts/catalog_bootstrap.py key | tee -a "$CATALOG_EVIDENCE/setup.log"
      - name: Fixed native catalog acceptance cases
        env:
          DJANGO_SETTINGS_MODULE: config.catalog_settings
          CAC_CATALOG_LOGIN: "1"
        run: |
          python -m unittest catalog_tests.test_catalog -v -f 2>&1 | tee "$CATALOG_EVIDENCE/catalog.log"
          grep -Eq 'Ran 8 tests? ' "$CATALOG_EVIDENCE/catalog.log"
      - name: Scan allowlisted evidence
        id: scan
        if: always() && steps.provenance.outcome == 'success'
        run: |
          if [[ ! -s "$CAC_TEST_CONFIG" || ! -s "$CAC_CATALOG_CONFIG" ]]; then
            echo "::error::Evidence scan requires both disposable fixture configurations"
            exit 1
          fi
          python scripts/catalog_scan.py | tee "$CATALOG_EVIDENCE/scan.log"
      - name: Upload scanned evidence
        if: always() && steps.provenance.outcome == 'success' && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: s010b-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-catalog/
          if-no-files-found: error
          retention-days: 30
      - name: Remove private credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/cac-s010b-foundation.json" "$RUNNER_TEMP/cac-s010b-catalog.json"
