name: S009B focused adversarial feedback
on:
  pull_request:
    paths: ['experimental/backend/**', '.github/workflows/s009b-focus.yml']
  push:
    branches: [work/s0-07-new-origin-backend-foundation, work/s0-09a-trusted-context-poc, work/s0-09b-issuer-pool-recovery-poc]
    paths: ['experimental/backend/**', '.github/workflows/s009b-focus.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s009b-focus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  s009b-focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # Official postgres:17.11-bookworm manifest digest verified from registry.
        image: postgres@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_DB: cac_s007_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-s007-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cac_s007_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: cac_s007_test
      PGPASSWORD: synthetic-s007-disposable-only
      CAC_EXPERIMENTAL_DISPOSABLE: '1'
      CAC_DB_ROLE: cac_owner
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: experimental/backend
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.15'
      - name: Prepare private fixtures
        run: |
          echo "CAC_TEST_CONFIG=$RUNNER_TEMP/cac-s009b-focus.json" >> "$GITHUB_ENV"
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pgbouncer=1.22.0-1build4
      - name: Bootstrap disposable database
        run: |
          python scripts/bootstrap.py
          python -m context_poc.migrate bootstrap
          python -m context_poc.migrate up
      - name: Focused process pool recovery tests
        env:
          CAC_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          sudo --preserve-env=CAC_TEST_CONFIG,CAC_EXPERIMENTAL_DISPOSABLE,CAC_POSTGRES_CONTAINER,PYTHONPATH,PYTHONDONTWRITEBYTECODE,PATH "$(which python)" -m unittest discover -s pool_recovery/tests -p 'test_*.py' -v 2>&1 | tee "$GITHUB_WORKSPACE/s009b-focus.log"
      - name: Scan focused evidence before upload
        id: credential-scan
        if: always()
        env:
          CAC_SCAN_PATH: ${{ github.workspace }}/s009b-focus.log
        run: python -m pool_recovery.scan_evidence
      - name: Cleanup private fixtures
        if: always()
        run: rm -f "$CAC_TEST_CONFIG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.credential-scan.outputs.safe == 'true'
        with:
          name: s009b-focus-${{ github.run_id }}
          path: s009b-focus.log
          retention-days: 30
