name: S009F assumed-W deny-only integration
on:
  push:
    branches: [work/s0-09f-w-oracle-deny-only-poc]
    paths: ['experimental/backend/**', '.github/workflows/w-oracle.yml', 'docs/S0_09F*.md', 'docs/security/S0_09F*.md', 'docs/changes/CR-S0-09F*.md']
  pull_request:
    paths: ['experimental/backend/**', '.github/workflows/w-oracle.yml', 'docs/S0_09F*.md', 'docs/security/S0_09F*.md', 'docs/changes/CR-S0-09F*.md']
permissions:
  contents: read
concurrency:
  group: s009f-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      primary:
        image: postgres@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_DB: cac_s007_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-s009c-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cac_s007_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      restore:
        image: postgres@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_DB: cac_s007_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-s009c-disposable-only
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cac_s007_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      anchor:
        image: postgres@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_DB: cac_s009c_anchor
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-s009c-disposable-only
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cac_s009c_anchor"
          --health-interval 3s --health-timeout 3s --health-retries 20
      witness:
        image: postgres@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_DB: cac_s009f_oracle
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-s009f-disposable-only
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cac_s009f_oracle"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      W_ORACLE_BANNER: 'W_ORACLE_ASSUMED / LANE1_ONLY / ROOT_AND_ORPHAN_RECOVERY_UNPROVED'
      CAC_EXPERIMENTAL_DISPOSABLE: '1'
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: experimental/backend
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.15'
      - name: Private config and exact revision
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "CAC_C_CONFIG=$RUNNER_TEMP/cac-s009f-parent.json" >> "$GITHUB_ENV"
          echo "CAC_F_CONFIG=$RUNNER_TEMP/cac-s009f-oracle.json" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/evidence-s009f"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/evidence-s009f/tested-sha.txt"
          printf '%s\n' "$W_ORACLE_BANNER" >> "$GITHUB_WORKSPACE/evidence-s009f/tested-sha.txt"
          printf '%s\n%s\n' "$PR_HEAD" "$W_ORACLE_BANNER" > "$GITHUB_WORKSPACE/evidence-s009f/pr-head-sha.txt"
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
      - name: Exact source and unchanged inherited implementation
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin ca043e2751ea1dbcb7aed3c1ed3d171a9bb1f0e2
          git -C "$GITHUB_WORKSPACE" diff --exit-code ca043e2751ea1dbcb7aed3c1ed3d171a9bb1f0e2 HEAD -- experimental/backend ':(exclude)experimental/backend/w_oracle/**'
          printf '%s\n' "$W_ORACLE_BANNER" > "$GITHUB_WORKSPACE/evidence-s009f/source-receipt.log"
          git rev-parse HEAD:experimental/backend/w_oracle >> "$GITHUB_WORKSPACE/evidence-s009f/source-receipt.log"
          if [ -n "$PR_HEAD" ]; then
            test "${#PR_HEAD}" = 40
            git fetch --no-tags --depth=1 origin "$PR_HEAD"
            git -C "$GITHUB_WORKSPACE" diff --exit-code "$PR_HEAD" HEAD -- experimental/backend .github/workflows/w-oracle.yml
            git rev-parse "$PR_HEAD":experimental/backend/w_oracle >> "$GITHUB_WORKSPACE/evidence-s009f/source-receipt.log"
          fi
          printf '%s\n' 'Inherited backend source unchanged; current head and synthetic merge target source identical where applicable.' >> "$GITHUB_WORKSPACE/evidence-s009f/source-receipt.log"
      - name: Install pinned transaction pooler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pgbouncer=1.22.0-1build4
          test "$(dpkg-query -W -f='${Version}' pgbouncer)" = '1.22.0-1build4'
          printf '%s\n' "$W_ORACLE_BANNER" > "$GITHUB_WORKSPACE/evidence-s009f/pool-versions.log"
          /usr/sbin/pgbouncer --version | tee -a "$GITHUB_WORKSPACE/evidence-s009f/pool-versions.log"
      - name: Independent cluster bootstrap
        env:
          CAC_C_A_CONTAINER: ${{ job.services.primary.id }}
          CAC_C_B_CONTAINER: ${{ job.services.restore.id }}
          CAC_C_C_CONTAINER: ${{ job.services.anchor.id }}
        run: |
          printf '%s\n' "$W_ORACLE_BANNER" > "$GITHUB_WORKSPACE/evidence-s009f/topology.log"
          python -m recovery_fencing.lab | tee -a "$GITHUB_WORKSPACE/evidence-s009f/topology.log"
      - name: Bootstrap assumed oracle outside ABC restore
        env:
          CAC_F_W_CONTAINER: ${{ job.services.witness.id }}
        run: python -m w_oracle.lab | tee "$GITHUB_WORKSPACE/evidence-s009f/oracle-bootstrap.log"
      - name: Assumed oracle contract tests
        run: python -m w_oracle.run 2>&1 | tee "$GITHUB_WORKSPACE/evidence-s009f/proof.log"
      - name: Targeted security sensitivity with exact restoration
        run: python -m w_oracle.sensitivity 2>&1 | tee "$GITHUB_WORKSPACE/evidence-s009f/sensitivity.log"
      - name: Full new suite after mutations restored
        run: python -m w_oracle.run 2>&1 | tee "$GITHUB_WORKSPACE/evidence-s009f/post-sensitivity.log"
      - name: Scan safe evidence
        id: scan
        if: always()
        run: python -m w_oracle.scan
      - name: Remove private fixtures
        if: always()
        run: rm -f "$CAC_C_CONFIG" "$CAC_C_CONFIG.A" "$CAC_C_CONFIG.B" "$CAC_F_CONFIG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.scan.outputs.safe == 'true'
        with:
          name: s009f-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-s009f/
          retention-days: 30
