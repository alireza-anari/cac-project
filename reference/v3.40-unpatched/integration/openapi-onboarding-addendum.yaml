openapi: 3.1.1
info:
  title: CAC Onboarding API — unmerged design addendum
  version: 0.3.40-design
  description: >-
    NOT DEPLOYED. CR-340-001 proposes these operations as an extension of the
    frozen 3.37 architecture. Identity verification and MFA are server-side only.
security:
  - AdminSession: []
paths:
  /api/v1/admin/onboarding/requests:
    post:
      operationId: requestFirstStore
      summary: Queue verified user's first store onboarding
      security:
        - AdminSession: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '202':
          description: Durable onboarding request queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatus'
        '409':
          $ref: '#/components/responses/SafeConflict'
  /api/v1/admin/onboarding/requests/{request_id}:
    get:
      operationId: getFirstStoreOnboardingStatus
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Status visible only to authenticated creator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatus'
        '404':
          description: No request in this principal's scope
  /api/v1/admin/stores/{store_id}/invitations:
    post:
      operationId: issueStoreInvitation
      description: >-
        Requires store.members.manage, same-store membership and a verified
        target. Sensitive rights require owner and fresh MFA. Delivery of the
        invitation secret is outside this API; do not return it in URLs/logs.
      security:
        - AdminSession: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '202':
          description: Invitation delivery queued by an approved channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationStatus'
  /api/v1/admin/invitations/{invitation_id}/accept:
    post:
      operationId: acceptStoreInvitation
      security:
        - AdminSession: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 40
      responses:
        '204':
          description: Invite redeemed once for the intended verified principal
        '403':
          description: Invalid or expired invitation (safe disclosure)
components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: sessionid
    AdminCSRF:
      type: apiKey
      in: header
      name: X-CSRFToken
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{24,128}$'
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StoreId:
      name: store_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    OnboardingRequest:
      type: object
      additionalProperties: false
      required: [tenant_name, store_name]
      properties:
        tenant_name:
          type: string
          minLength: 1
          maxLength: 120
        store_name:
          type: string
          minLength: 1
          maxLength: 120
    OnboardingStatus:
      type: object
      additionalProperties: false
      required: [request_id, state]
      properties:
        request_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [QUEUED, COMPLETED, BLOCKED]
        tenant_id:
          type: ['string', 'null']
          format: uuid
        store_id:
          type: ['string', 'null']
          format: uuid
        error_code:
          type: ['string', 'null']
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [target_principal_id, capabilities]
      properties:
        target_principal_id:
          type: integer
          minimum: 1
        capabilities:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
    InvitationStatus:
      type: object
      additionalProperties: false
      required: [invitation_id, state]
      properties:
        invitation_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [PENDING_DELIVERY, SENT, ACCEPTED, REVOKED, EXPIRED]
  responses:
    SafeConflict:
      description: Reused key with different payload or ownership conflict
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, request_id]
            properties:
              error:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum: [IDEMPOTENCY_CONFLICT, FIRST_TENANT_ALREADY_EXISTS]
                  message:
                    type: string
                required: [code, message]
              request_id:
                type: string
